# Physical hardware. FROZEN 2026-09-03 by the builder.
#
# Bridges the CAD-derived geometry (triple_pendulum_params.yaml) to the things
# CAD cannot express: actuation limits, sensing, latency.
#
# Values marked MEASURE are deliberately left null. They are not guesses waiting
# to be refined -- they are the parameters this project exists to study, and
# inventing them would poison the sim-to-real comparison.

drive:
  # ---- FROZEN: architecture (a), STEP/DIR position mode -------------------
  # Teensy --STEP/DIR--> CNC4PC C34SOA6-RS --> A6-RS in POSITION mode
  #
  # Chosen over direct RS485 torque control (which was briefly frozen and then
  # reversed) because the real-time path has to carry a fresh command every few
  # milliseconds:
  #   * STEP/DIR is a bare pulse train the A6-RS accepts up to 4 MHz --
  #     deterministic, no packet framing, no reply, negligible latency.
  #   * Modbus RTU means register write + CRC + reply per command. Fine for
  #     configuration and telemetry, poor for a balancing loop.
  #   * The A6-RS does have a torque mode, but its documented CONTINUOUS torque
  #     reference path is the analog input; the Modbus guide covers
  #     position/speed/profile commands.
  # It also needs no hardware change: the C34SOA6-RS is already in the BOM and
  # is built for exactly this.
  architecture: "a_stepdir_position"
  command_mode: step_dir_position
  c34_bypassed: false
  controller: Teensy
  interface: CNC4PC C34SOA6-RS
  max_pulse_rate_hz: 4.0e6
  bus: Waveshare RS485 -- CONFIGURATION AND DIAGNOSTICS ONLY, not the control path

  # ---- what the RL action must therefore be ------------------------------
  # Pulse frequency advances the commanded position, so the natural command is
  # a signed cart VELOCITY:
  #
  #   a_t -> v_cmd -> pulse frequency + DIR -> integrated position reference
  #       -> A6 position loop -> motor torque (saturated) -> GT2 -> cart force
  #
  # Isaac therefore uses JointVelocityActionCfg with the servo modelled as a
  # stiff inner velocity loop under a force clamp. Training against raw torque
  # would produce a policy the hardware cannot execute.
  rl_action: cart_velocity

  # ---- FROZEN: motor --------------------------------------------------
  servo: StepperOnline A6-RS400H2A1-M17
  rated_power_W: 400
  frame_mm: 60
  shaft_mm: 14
  rated_torque_Nm: 1.27
  peak_torque_Nm: 4.45
  rated_speed_rpm: 3000
  peak_speed_rpm: 6000
  rotor_inertia_kgm2: 5.9e-5      # from the exact motor datasheet
  encoder_bits_motor: 17          # absolute

  # The 750 W (A6-RS750H2A1-M17) was considered and rejected: it gives 2.39 /
  # 8.36 N.m but its rotor inertia is 1.72e-4 kg.m^2, ~2.9x larger, which would
  # nearly triple the drivetrain's contribution to the cart's translating
  # inertia. Not worth it unless 400 W is shown to be insufficient.

  # ---- FROZEN: transmission -------------------------------------------
  belt: GT2, 2 mm tooth pitch
  pulley: HomeDIYer 40T
  teeth: 40
  # r = N * pitch / (2*pi) = 40 * 0.002 / (2*pi)
  pitch_radius_m: 0.0127324
  pitch_diameter_m: 0.0254648

  # ---- derived: cart-side limits --------------------------------------
  # F = tau / r ; v = omega * r
  rated_cart_force_N: 99.7        # 1.27 / 0.0127324
  peak_cart_force_N: 349.5        # 4.45 / 0.0127324
  max_cart_speed_ms: 4.0          # 3000 rpm
  peak_cart_speed_ms: 8.0         # 6000 rpm

  # Action scale is now a SPEED, at the rated 3000 rpm. Force still bounds what
  # the inner loop can deliver: rated 99.7 N, clamped at the peak 349.5 N.
  action_scale_speed_ms: 4.0
  rated_cart_force_used_N: 99.7
  drive_clamp_force_N: 349.5      # hard current limit, should not normally bind
  # inner velocity-loop gain used in sim [N.s/m]; ~2 ms loop time constant
  # against the 0.79 kg effective translating mass. ASSUMED pending drive tuning.
  velocity_loop_gain_Nsm: 400.0

  # Reflected drivetrain inertia: the rotor seen from the cart is an added mass
  #   m = J_r / r^2 = 5.9e-5 / 1.6211e-4 = 0.36394 kg
  # against the 0.42659 kg CAD cart, i.e. 85% of it again, for a translating
  # total of 0.79053 kg. Not negligible, and it exists nowhere in the CAD.
  reflected_mass_kg: 0.36394
  # pulleys, idler and belt add a little more; not yet accounted for

  braking_resistor: yes           # regen capable -> hard reversals supported
  supply: VEVOR ST-2000VA transformer + AutomationDirect PSU

  # ---- MEASURE on hardware; do not invent -----------------------------
  control_loop_rate_hz: null      # MEASURE  Teensy update rate for v_cmd
  command_jitter_s: null          # MEASURE

  # ---- servo response: PESSIMISTIC PLACEHOLDER, still to be measured ------
  # Published settling figures for drives of this class land around 50 ms, so
  # the worst case assumed here is 100 ms -- roughly double -- rather than the
  # ~2 ms an ideal loop would give.
  #
  # This is a severe assumption and deliberately so: the upright equilibrium
  # has lambda_max = 15.5 rad/s, a 64 ms divergence time constant. An actuator
  # lag of 100 ms is LONGER than the time the pendulum takes to run away, so if
  # control survives it, it survives anything the real drive will do.
  #
  # Split into two effects because they hurt differently -- see
  # source/triple_project/actuators/servo_action.py.
  servo_time_constant_s: 0.100    # ASSUMED WORST CASE  (MEASURE)
  servo_transport_delay_s: 0.0    # MEASURE separately; dead time is worse than lag
  servo_time_constant_measured_s: null   # MEASURE -> replace the assumption

sensing:
  joint_encoders: 3x MT6701 magnetic, one per revolute joint
  encoder_bits: 14                # 16384 counts/rev -> 3.83e-4 rad quantisation
  cart_position: from the A6 17-bit absolute encoder via the drive
  cart_electronics: Seeed XIAO ESP32-C3 + 3x LiPo, on the cart
  encoder_latency_s: null         # MEASURE  a prime sim-to-real suspect (tau_delay in xi)

motion:
  rail: 2x SBR20, 1.524 m (60 in) span
  usable_travel_m: 1.2            # sim soft bound +-0.60 m
  carriage: LM20 / SBR20 blocks
  limit_switches: yes             # hardware end stops beyond the soft bound
  # RESOLVED. The carriages were previously being assigned to the base instead
  # of the cart -- a first-match-wins bug in the body grouping, since the
  # bearings live under the "R6Base Assembly-1/" prefix but ride on the cart.
  # tools/grouping.py now resolves by LONGEST matching prefix, which puts the
  # 0.28178 kg of R6Linear_Bearings (10 bodies) on the cart where they belong:
  #   0.14481 (old, wrong) + 0.28178 = 0.42659 kg, as in
  #   configs/robot/triple_pendulum_params.yaml
  cart_mass_incomplete: false

structure:
  extrusion: AutomationDirect
  shafts: MISUMI NSFMR8-80, 2x NSFMR8-35 (8 mm)
  joint_bearings: 608 + McMaster ball bearings, set-screw collars
  links: PETG printed

safety:
  estop: yes
  contactor: yes
  breaker: yes
